<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>String Exercise 2</title>
	<style>
	  body {
	     width:400px;
		 margin:0 auto;
	  }
	  
	  p {
	     border: solid black 1px;
		 height: 20px;
	  }
	</style>
</head>

<body>
<h1>String Exercise Two</h1>
<p id = "input"></p>
<p id = "length"></p>
<p id = "firstDot"></p>
<p id = "lastDot"></p>
<p id = "symbol"></p>
<button>String Exercise 2</button>

<script>

const btn = document.querySelector('button');
  
btn.addEventListener('click', (evt) => { let message = "";
      const you = prompt("Enter your email", "");


  document.querySelector('#input').textContent =
    `The email you have entered is ${you}`;

	  you.indexOf("@")>=0 ? message =`The @ symbol is at position ${you.indexOf("@")}`
	                      : message =`The @ symbol is NOT included`;
	  document.querySelector('#symbol').textContent = message;

	   document.querySelector('#length').textContent =
    `The length of your name (${you}) is ${you.length}`;

		  you.indexOf(".")>=0 ? message =`The first . symbol is at position ${you.indexOf(".")}`
	                      : message =`The . symbol is NOT included`;
	  document.querySelector('#firstDot').textContent = message;

    	  you.indexOf(".")>=0 ? message =`The last . symbol is at position ${you.lastIndexOf(".")}`
	                      : message =`The . symbol is NOT included`;
	  document.querySelector('#lastDot').textContent = message;})
  

	
</script>

</body>
</html>
