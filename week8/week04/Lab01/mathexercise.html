<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<title>Math Library</title>
	<style>
		body {
			width: 400px;
			margin: 0 auto;
		}

		p {
			border: solid black 1px;
			height: 20px;
		}
	</style>
</head>

<body>
	<h1>The Math Library</h1>
	<p id="num"></p>
	<p id="area"></p>
	<p id="circumference"></p>
	<button>Circle Calculations</button>
	<script>
		const btn = document.querySelector('button');

		btn.addEventListener('click', (evt) => {

	
        let radius = parseInt(prompt("Enter the radius of the circle:"));

        document.querySelector('#num').textContent =
            `The radius you entered is ${radius}`;

       

        let area = Math.PI * radius ** 2;
        let circumference = 2 * Math.PI * radius;

        document.querySelector('#area').textContent =
            `Area of the circle is ${area.toFixed(5)}`;

        document.querySelector('#circumference').textContent =
            `Circumference of the circle is ${circumference.toFixed(5)}`;
    });
</script>

	
	
	
	</script>

</body>

</html>
