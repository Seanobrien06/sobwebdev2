 <body>
 <h1>Switch Statement</h2>
 <p>Look in the console for output</p>
 <script>
let color = "red";
 switch (color) { case 'red': console.log(`${color} means stop`); 
 break; 
case 'yellow': console.log(`${color} means slow`); 
break; 
case 'green': console.log(`${color} means go`); 
break;
}

 </script>
 </body>
