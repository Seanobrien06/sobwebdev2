 <body>
 <h1>For Loop</h1>
 <p>Look in the console for output</p>
 <script>
    let total= 0
    let count = 0
for (let i = 2; i <= 20; i += 2) { console.log(i); 
total += i;
count ++;
}
let average = total / count;
console.log("Average:", average);
 </script>
