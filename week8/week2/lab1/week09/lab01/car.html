<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Car Booking</title>
    <link rel="stylesheet" href="css/style.css">
  </head>

  <body>
    <div id="container">
      <header>
        <h1>Book a Car</h1>
      </header>
      <main>
        <section id="form">
          <h2>Contact Us</h2>

          <form action="process.html" method="get" id="booking">
            <div class="form-row">
              <label for="contactname">Name</label>

              <input type = "text" name="contactname" id="contactname" autofocus required title="Please enter a name (Surname optional) with first letter capitalised" part="[A-Z][a-z]+([A-Z][a-z]+)*">
              
              >
            </div>
            <div class="form-row">
              <label for="email">Email Address</label>
              <input  type="email" name="email"  id="email" required title="Please enetr a valid email address" pattern = “[a-z0-9._%+-]+@[a-z0-9.-]+.[a-z]{2,}$”>
               
                
               
                
              
            </div>
            
              <h2>Do you have a drivers license?</h2>
              <label for = "drivery">  <input type="radio" name="driver1" id = "drivery" value="drivery" checked="checked"> Yes</label>
              <br><label for = "drivern">      <input type="radio" name="driver1" id = "drivern" value="drivern" checked="checked"> No</label>
              
             
            </div>
            <div class = "form-row">
            <label for = "age" >Enter age</label>
              <input type = "number" name = "age" id = "age" min = "17" max = "80" required title="Please enter an age between 17 and 80">
            </div>
             <div class = "form-row">
              <label for="book_date">Booking date</label>
              <input type="date" name="book_date" id="book_date" required title="Please enter a valid date">

            </div>
            <div class = "form-row">
              <label for = "car" >Please select a car:</label>
              <select name="car" id="car">
                <option value="ford">Ford Focus</option>
                <option value="hyundai">Hyundai Tucson</option>
                    <option value="toyota">Toyota Rav4</option>
                    <option value="renault">Renault Kadjar</option>
                    <option value="nissan">Nissan Qashqai</option>
                      </select>

            </div>
            <div class = "text">
             
               <h2>Please provide any other details you think will be useful to us in the text area below (it may save us calling or emailing you, and help avoid more delays).
              </h2>
                
            </div>
            <br>
            <div class = "form-row">
             
              <h2>More details (as much as you think we'll need!):</h2>
              <textarea name="details" id="details" rows="7" cols="40"></textarea>
            
           </div>
           <div class = "button">
           <p>
            <br>
            <button type="submit"> Send us the info</button>
              <button type="reset"> clear the info</button>
           </div>
      
          </form>
        </section>
        <section id="image">
          <figure>
            <img src="images/car.jfif" alt="Car" class="ui fluid image">
            <figcaption>Car Rental</figcaption>
          </figure>
        </section>
      </main>
    </div>
  </body>
</html>
